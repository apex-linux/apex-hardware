# Matches: every battery that UPower supports a charge limit on; the file
#   has no effect on a machine without one.
# Why: UPower keeps one global switch for the charge limit in this file, as
#   the single byte "1" or "0", and treats a missing file as off. The Apex
#   default is on, to protect the battery. "f" creates the file only when it
#   is missing, so a later choice in Settings > Power stays. 0640 is the mode
#   UPower writes it with.

f /var/lib/upower/charging-threshold-status 0640 root root - 1
